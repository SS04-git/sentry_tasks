services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next 
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:10000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:                              
        condition: service_healthy     

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: sentry_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ssj051004
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:                                          
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentry_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: